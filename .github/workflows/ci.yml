name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ["1.21", "stable"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      - run: go vet ./playground
        env:
          GOOS: js
          GOARCH: wasm
      - run: go test ./...
      - if: matrix.os == 'ubuntu-latest'
        run: go test -race ./...
      - if: matrix.os == 'ubuntu-latest' && matrix.go == 'stable'
        run: test -z "$(gofmt -l .)"
